# CI/CD: проверка каждого пуша и деплой из main.
#
#   quality ──┐
#             ├──► deploy (только push в main): миграции → функция → проверка API
#   api-tests ┘
#                                   │ workflow завершён успешно
#                                   ▼
#               Vercel собирает и выкладывает фронтенд этого коммита
#
# Деплой стоит за обоими проверочными этапами: красный линтер или упавший тест API
# не дают коду попасть на прод. Фронтенд выкладывает Vercel из git, но только ветку
# main и только после зелёного завершения ЭТОГО workflow: перед сборкой Vercel
# запускает scripts/vercel-wait-ci.mjs (ignoreCommand в vercel.json), а тот ждёт
# статус запуска в GitHub. Так фронтенд всегда выходит после бэкенда, а токен
# Vercel в GitHub не нужен вовсе.
#
# Сторонние actions закреплены по SHA, а CLI — точными версиями: деплой держит
# прод-токены, и перевешенный тег или свежий скомпрометированный релиз не должен
# получить к ним доступ. Обновляет закрепления Dependabot — через тот же CI.

name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет недоделанный прогон, но не деплой:
# прерванная посередине выкладка оставила бы базу и функцию разных версий.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # 22, не 20: supabase-js в скриптах и тестах требует встроенный WebSocket, он есть с Node 22.
  NODE_VERSION: '22'
  DENO_VERSION: '2.x'

jobs:
  quality:
    name: Линтер, типы, юнит-тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier — форматирование
        run: npm run format:check

      - name: TypeScript — фронтенд
        run: npm run typecheck

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Deno — типы и линтер функции API
        working-directory: supabase/functions/api
        run: |
          deno check index.ts
          deno lint

      - name: Юнит-тесты и тесты экранов
        run: npm test

      - name: Сборка
        run: npm run build
        env:
          # Для сборки нужны только адрес и публичный ключ — подставляем заглушки:
          # этот артефакт никуда не выкладывается, прод собирается в deploy.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  api-tests:
    name: Тесты API на живом Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.121.0

      # Поднимаем ровно то, что нужно тестам: базу, Auth, шлюз и рантайм функций.
      # Studio, хранилище и аналитика только удлинили бы прогон.
      - name: Supabase — база, Auth, миграции
        run: supabase start -x studio,imgproxy,storage-api,realtime,logflare,vector,supavisor,postgres-meta,mailpit

      # Ключи одноразового стенда в контейнере раннера: к проду они отношения не имеют,
      # но в лог всё равно не пишем — маскируем, как настоящие секреты.
      - name: Ключи локального стенда
        run: |
          supabase status -o json > status.json
          for key in ANON_KEY SERVICE_ROLE_KEY; do echo "::add-mask::$(jq -r ".$key" status.json)"; done
          {
            echo "SUPABASE_URL=$(jq -r .API_URL status.json)"
            echo "SUPABASE_ANON_KEY=$(jq -r .ANON_KEY status.json)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r .SERVICE_ROLE_KEY status.json)"
          } >> "$GITHUB_ENV"
          rm status.json

      - name: Функция API
        run: |
          printf 'ALLOWED_ORIGINS=http://localhost:5173\n' > supabase/functions/.env
          supabase functions serve --env-file supabase/functions/.env > functions.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "$SUPABASE_URL/functions/v1/api/health" > /dev/null && exit 0
            sleep 2
          done
          echo "Функция не поднялась за 2 минуты"; cat functions.log; exit 1

      - name: Демо-данные
        run: npm run seed:demo

      - name: Интеграционные тесты API
        run: npm run test:api

      - name: Логи функции (при падении)
        if: failure()
        run: cat functions.log

  deploy:
    name: Деплой бэкенда
    needs: [quality, api-tests]
    # DEPLOY_ENABLED — переменная репозитория: деплой бэкенда включается, когда в окружении
    # production задан SUPABASE_ACCESS_TOKEN. Без неё джоба пропускается, а не падает на
    # пустом токене; фронтенд при этом выкладывается всё равно (см. шапку файла).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://finance-fullstack-demo.vercel.app
    # Здесь только несекретный идентификатор. Токен выдаётся каждому шагу отдельно,
    # а не всей джобе: шагу проверки он не нужен.
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.121.0

      # Пароль базы не нужен: по токену доступа CLI сам заводит временную роль для входа.
      # Сначала база: новая версия функции может рассчитывать на новые столбцы,
      # а старая версия переживёт добавленные — миграции у нас только добавляющие.
      - name: Миграции базы
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push

      - name: Функция API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Версия выкладки попадает в /health — по ней видно, какой коммит на проде.
          supabase secrets set APP_VERSION="${GITHUB_SHA::7}" --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF"

      # Деплой считается успешным, только если API действительно отвечает новой версией.
      # Иначе workflow красный, и Vercel не выложит фронтенд под сломанный бэкенд.
      - name: Проверка API после выкладки
        run: |
          for i in $(seq 1 10); do
            body=$(curl -sf "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/api/health" || true)
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q "\"version\":\"${GITHUB_SHA::7}\""; then
              echo "API отвечает, версия ${GITHUB_SHA::7}"; exit 0
            fi
            sleep 6
          done
          echo "API не отвечает новой версией после выкладки"; exit 1
